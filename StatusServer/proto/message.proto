syntax = "proto3";

package message;

service VarifyService {
  rpc GetVarifyCode (GetVarifyRequest) returns (GetVarifyRsponse) {}
}

message GetVarifyRequest {
  string email = 1;
}

message GetVarifyRsponse {
  int32 error = 1;
  string email = 2;
  string code = 3;
}

message GetChatServerRequest {
  int32 uid = 1;
}

message GetChatServerRsponse {
  int32 error = 1;
  string host = 2;
  string port = 3;
  string token = 4;
}

message LoginRequest{
    int32 uid = 1;
    string token= 2;
}

message LoginRsponse {
    int32 error = 1;
    int32 uid = 2;
    string token = 3;
}

service StatusService {
    rpc GetChatServer (GetChatServerRequest) returns (GetChatServerRsponse) {}
    rpc Login(LoginRequest) returns(LoginRsponse);
}